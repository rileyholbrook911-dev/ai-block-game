<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Block Game - Full UI</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }#moveJoy { position:fixed; bottom:30px; left:30px; width:120px; height:120px; background:rgba(255,255,255,0.1); border-radius:50%; } .stick { width:50px; height:50px; background:#fff; border-radius:50%; position:absolute; left:35px; top:35px; }

#jumpBtn { position:fixed; bottom:140px; right:40px; width:70px; height:70px; background:rgba(255,255,255,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:22px; }

#crosshair { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:white; font-size:20px; }

#hotbar { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }

.slot { width:50px; height:50px; border:2px solid rgba(255,255,255,0.4); background:rgba(0,0,0,0.4); }

.slot.selected { border:3px solid white; }

#inventoryCount { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); color:white; font-size:18px; } </style>

</head>
<body><div id="moveJoy"><div class="stick" id="moveStick"></div></div>
<div id="jumpBtn">↑</div>
<div id="crosshair">+</div>
<div id="inventoryCount">Wood: 0</div><div id="hotbar">
  <div class="slot selected"></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
</div><script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script><script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const raycaster = new THREE.Raycaster();
const center = new THREE.Vector2(0,0);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshLambertMaterial({color:0x4caf50}));
ground.rotation.x = -Math.PI/2;
scene.add(ground);

let player = {x:0,z:0,y:1.6,velocityY:0,grounded:true,radius:0.4};
let rotation = {yaw:0,pitch:0};
let wood = 0;

let trees = [];
let collectibles = [];

function createTree(x,z){
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.8,2,0.8), new THREE.MeshLambertMaterial({color:0x8B4513}));
  trunk.position.set(x,1,z);
  trunk.userData.type = 'tree';

  const leaves = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshLambertMaterial({color:0x2e7d32}));
  leaves.position.set(x,3,z);

  scene.add(trunk);
  scene.add(leaves);

  trees.push({mesh:trunk,x,z,size:0.8});
}

for(let i=0;i<15;i++) createTree((Math.random()-0.5)*20,(Math.random()-0.5)*20);

function spawnItem(x,z){
  const item = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4), new THREE.MeshLambertMaterial({color:0xffff00}));
  item.position.set(x,1,z);
  scene.add(item);
  collectibles.push(item);
}

let move={x:0,y:0};
const base=document.getElementById('moveJoy');
const stick=document.getElementById('moveStick');

base.addEventListener('touchmove', e=>{
  const rect=base.getBoundingClientRect();
  const x=e.touches[0].clientX-rect.left-rect.width/2;
  const y=e.touches[0].clientY-rect.top-rect.height/2;
  move.x=x/50; move.y=y/50;
  stick.style.left=(35+x/2)+'px';
  stick.style.top=(35+y/2)+'px';
});
base.addEventListener('touchend', ()=>{move.x=0;move.y=0;stick.style.left='35px';stick.style.top='35px';});

let touching=false;
let lastX=0,lastY=0;

document.addEventListener('touchstart', e=>{
  if(e.target.id!=='moveJoy'){
    touching=true;
    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  }
});

document.addEventListener('touchmove', e=>{
  if(touching){
    let dx=e.touches[0].clientX-lastX;
    let dy=e.touches[0].clientY-lastY;
    rotation.yaw-=dx*0.003;
    rotation.pitch-=dy*0.003;
    rotation.pitch=Math.max(-1.5,Math.min(1.5,rotation.pitch));
    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  }
});

document.addEventListener('touchend', ()=>touching=false);

const jumpBtn=document.getElementById('jumpBtn');
jumpBtn.addEventListener('touchstart', ()=>{
  if(player.grounded){player.velocityY=0.25;player.grounded=false;}
});

document.addEventListener('click', ()=>{
  raycaster.setFromCamera(center,camera);
  const hits=raycaster.intersectObjects(scene.children);
  for(let h of hits){
    if(h.object.userData.type==='tree'){
      scene.remove(h.object);
      spawnItem(h.object.position.x,h.object.position.z);
      break;
    }
  }
});

function checkCollision(nx,nz){
  for(let t of trees){
    let dx=nx-t.x,dz=nz-t.z;
    if(Math.sqrt(dx*dx+dz*dz)<player.radius+t.size/2) return true;
  }
  return false;
}

function animate(){
  requestAnimationFrame(animate);

  let newX=player.x;
  let newZ=player.z;

  newX+=Math.sin(rotation.yaw)*move.y*0.1;
  newZ+=Math.cos(rotation.yaw)*move.y*0.1;
  newX+=Math.cos(rotation.yaw)*move.x*0.1;
  newZ-=Math.sin(rotation.yaw)*move.x*0.1;

  if(!checkCollision(newX,player.z)) player.x=newX;
  if(!checkCollision(player.x,newZ)) player.z=newZ;

  player.velocityY-=0.01;
  player.y+=player.velocityY;
  if(player.y<=1.6){player.y=1.6;player.velocityY=0;player.grounded=true;}

  camera.position.set(player.x,player.y,player.z);
  camera.rotation.order='YXZ';
  camera.rotation.y=rotation.yaw;
  camera.rotation.x=rotation.pitch;

  collectibles.forEach((item,i)=>{
    item.rotation.y+=0.05;
    item.position.y=1+Math.sin(Date.now()*0.005)*0.2;

    let dx=player.x-item.position.x;
    let dz=player.z-item.position.z;
    if(Math.sqrt(dx*dx+dz*dz)<1){
      scene.remove(item);
      collectibles.splice(i,1);
      wood++;
      document.getElementById('inventoryCount').innerText='Wood: '+wood;
    }
  });

  renderer.render(scene,camera);
}

animate();
</script></body>
</html>
