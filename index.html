<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Minecraft Mobile</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }#moveJoy { position:fixed; bottom:30px; left:30px; width:120px; height:120px; background:rgba(255,255,255,0.1); border-radius:50%; } .stick { width:50px; height:50px; background:#fff; border-radius:50%; position:absolute; left:35px; top:35px; }

#jumpBtn, #placeBtn { position:fixed; right:40px; width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; } #jumpBtn { bottom:140px; background:rgba(255,255,255,0.2); } #placeBtn { bottom:220px; background:rgba(0,255,0,0.3); }

#inventoryBtn { position:fixed; top:20px; right:20px; width:60px; height:60px; background:rgba(255,255,255,0.2); border-radius:10px; display:flex; align-items:center; justify-content:center; }

#inventoryUI { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:260px; background:rgba(0,0,0,0.85); display:none; color:white; padding:10px; } .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; } .slot { width:60px; height:60px; border:1px solid white; }

#crosshair { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:white; } #inventoryCount { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); color:white; } </style>

</head>
<body><div id="moveJoy"><div class="stick" id="moveStick"></div></div>
<div id="jumpBtn">↑</div>
<div id="placeBtn">⬛</div>
<div id="inventoryBtn">🎒</div>
<div id="crosshair">+</div>
<div id="inventoryCount">Wood: 0 | Planks: 0</div><div id="inventoryUI">
  <div>Crafting</div>
  <div class="grid">
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
  </div>
  <button id="craftBtn">1 Wood → 4 Planks</button>
</div><script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script><script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const raycaster = new THREE.Raycaster();
const center = new THREE.Vector2(0,0);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

function getHeight(x,z){ return Math.floor(Math.sin(x*0.3)*2 + Math.cos(z*0.3)*2); }

let blocks=[], items=[];

function addBlock(x,y,z,color,type){
  const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({color}));
  m.position.set(x,y,z);
  m.userData.type=type;
  scene.add(m);
  blocks.push(m);
}

// terrain
for(let x=-20;x<=20;x++){
  for(let z=-20;z<=20;z++){
    let h=getHeight(x,z);
    for(let y=0;y<=h;y++){
      addBlock(x,y,z, y===h?0x4caf50:0x795548,'ground');
    }
  }
}

// trees
for(let i=0;i<10;i++){
  let x=Math.floor((Math.random()-0.5)*20);
  let z=Math.floor((Math.random()-0.5)*20);
  let base=getHeight(x,z)+1;

  for(let y=0;y<3;y++) addBlock(x,base+y,z,0x8B4513,'wood');

  for(let lx=-1;lx<=1;lx++)
    for(let lz=-1;lz<=1;lz++)
      for(let ly=2;ly<=3;ly++)
        addBlock(x+lx,base+ly,z+lz,0x2e7d32,'leaf');
}

function spawnItem(x,y,z){
  const i=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4), new THREE.MeshLambertMaterial({color:0xffff00}));
  i.position.set(x,y,z);
  scene.add(i);
  items.push(i);
}

let spawnY=getHeight(0,0)+2;
let player={x:0,z:0,y:spawnY,vy:0,grounded:false};
let rot={yaw:0,pitch:0};
let wood=0, planks=0;

// UI
const invUI=document.getElementById('inventoryUI');
document.getElementById('inventoryBtn').onclick=()=>{
  invUI.style.display = invUI.style.display==='none'?'block':'none';
};

document.getElementById('craftBtn').onclick=()=>{
  if(wood>0){ wood--; planks+=4; updateUI(); }
};

function updateUI(){
  document.getElementById('inventoryCount').innerText=`Wood: ${wood} | Planks: ${planks}`;
}

// joystick
let move={x:0,y:0};
const joy=document.getElementById('moveJoy');
const stick=document.getElementById('moveStick');

joy.addEventListener('touchmove',e=>{
  const r=joy.getBoundingClientRect();
  const x=e.touches[0].clientX-r.left-r.width/2;
  const y=e.touches[0].clientY-r.top-r.height/2;
  move.x=x/50; move.y=y/50;
  stick.style.left=(35+x/2)+'px';
  stick.style.top=(35+y/2)+'px';
});

joy.addEventListener('touchend',()=>{move.x=0;move.y=0;});

// look fix
let touching=false,lastX=0,lastY=0;
document.addEventListener('touchstart',e=>{
  const r=joy.getBoundingClientRect();
  const x=e.touches[0].clientX, y=e.touches[0].clientY;
  if(x>r.left&&x<r.right&&y>r.top&&y<r.bottom) return;
  touching=true; lastX=x; lastY=y;
});

document.addEventListener('touchmove',e=>{
  if(touching){
    let dx=e.touches[0].clientX-lastX;
    let dy=e.touches[0].clientY-lastY;
    rot.yaw-=dx*0.003;
    rot.pitch-=dy*0.003;
    rot.pitch=Math.max(-1.5,Math.min(1.5,rot.pitch));
    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  }
});

document.addEventListener('touchend',()=>touching=false);

// jump
jumpBtn.onclick=()=>{ if(player.grounded){ player.vy=0.25; player.grounded=false; } };

// mine
document.addEventListener('click',()=>{
  raycaster.setFromCamera(center,camera);
  const hits=raycaster.intersectObjects(blocks);
  if(hits.length){
    let b=hits[0].object;
    scene.remove(b);
    blocks.splice(blocks.indexOf(b),1);
    if(b.userData.type==='wood') spawnItem(b.position.x,b.position.y,b.position.z);
  }
});

// place
placeBtn.onclick=()=>{
  if(wood<=0) return;
  raycaster.setFromCamera(center,camera);
  const hits=raycaster.intersectObjects(blocks);
  if(hits.length){
    let h=hits[0];
    let pos=h.object.position.clone().add(h.face.normal);
    addBlock(Math.round(pos.x),Math.round(pos.y),Math.round(pos.z),0x8B4513,'wood');
    wood--; updateUI();
  }
};

function animate(){
  requestAnimationFrame(animate);

  player.x+=Math.sin(rot.yaw)*move.y*0.1;
  player.z+=Math.cos(rot.yaw)*move.y*0.1;
  player.x+=Math.cos(rot.yaw)*move.x*0.1;
  player.z-=Math.sin(rot.yaw)*move.x*0.1;

  player.vy-=0.01;
  player.y+=player.vy;
  if(player.y<=getHeight(player.x,player.z)+2){
    player.y=getHeight(player.x,player.z)+2;
    player.vy=0; player.grounded=true;
  }

  camera.position.set(player.x,player.y,player.z);
  camera.rotation.order='YXZ';
  camera.rotation.y=rot.yaw;
  camera.rotation.x=rot.pitch;

  items.forEach((it,i)=>{
    it.rotation.y+=0.05;
    if(Math.hypot(player.x-it.position.x, player.z-it.position.z)<1){
      scene.remove(it);
      items.splice(i,1);
      wood++; updateUI();
    }
  });

  renderer.render(scene,camera);
}

animate();
</script></body>
</html>
