<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Block Game 3D</title>
<style>
body { margin:0; overflow:hidden; }
#joystick {
  position:fixed; bottom:40px; left:40px;
  width:100px; height:100px; background:rgba(255,255,255,0.1);
  border-radius:50%; touch-action:none;
}
#stick {
  width:40px; height:40px; background:#fff;
  border-radius:50%; position:absolute; left:30px; top:30px;
}
</style>
</head>
<body>

<div id="joystick"><div id="stick"></div></div>

<!-- ✅ FIXED Three.js link -->
<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Light
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshLambertMaterial({color:0x4caf50})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Player
const player = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshLambertMaterial({color:0x0000ff})
);
player.position.y = 0.5;
scene.add(player);

// AI
const ai = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshLambertMaterial({color:0xff0000})
);
ai.position.set(3,0.5,3);
scene.add(ai);

// Camera
camera.position.set(0,5,5);
camera.lookAt(player.position);

// Trees
for(let i=0;i<30;i++){
  const tree = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3,0.3,2),
    new THREE.MeshLambertMaterial({color:0x2e7d32})
  );
  tree.position.set((Math.random()-0.5)*20,1,(Math.random()-0.5)*20);
  scene.add(tree);
}

// Joystick
let joy = {x:0,y:0};
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');

joystick.addEventListener('touchmove', e=>{
  const rect = joystick.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left - 50;
  const y = e.touches[0].clientY - rect.top - 50;
  joy.x = x/40;
  joy.y = y/40;
  stick.style.left = (30 + x/2) + 'px';
  stick.style.top = (30 + y/2) + 'px';
});

joystick.addEventListener('touchend', ()=>{
  joy.x = 0; joy.y = 0;
  stick.style.left = '30px';
  stick.style.top = '30px';
});

// AI follow
function aiThink(){
  const dx = player.position.x - ai.position.x;
  const dz = player.position.z - ai.position.z;
  ai.position.x += dx * 0.02;
  ai.position.z += dz * 0.02;
}

// Game loop
function animate(){
  requestAnimationFrame(animate);

  player.position.x += joy.x * 0.1;
  player.position.z += joy.y * 0.1;

  camera.position.x = player.position.x;
  camera.position.z = player.position.z + 5;
  camera.lookAt(player.position);

  aiThink();

  renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
