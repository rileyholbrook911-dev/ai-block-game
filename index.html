<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Block Game 3D FPS</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }#moveJoy { position:fixed; bottom:30px; left:30px; width:110px; height:110px; background:rgba(255,255,255,0.1); border-radius:50%; } #lookJoy { position:fixed; bottom:30px; right:30px; width:110px; height:110px; background:rgba(255,255,255,0.1); border-radius:50%; }

.stick { width:40px; height:40px; background:#fff; border-radius:50%; position:absolute; left:35px; top:35px; }

#jumpBtn { position:fixed; bottom:160px; right:50px; width:70px; height:70px; background:rgba(255,255,255,0.2); border-radius:50%; color:white; font-size:20px; display:flex; align-items:center; justify-content:center; }

#crosshair { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:white; font-size:20px; } </style>

</head>
<body><div id="moveJoy"><div class="stick" id="moveStick"></div></div>
<div id="lookJoy"><div class="stick" id="lookStick"></div></div>
<div id="jumpBtn">↑</div>
<div id="crosshair">+</div><script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script><script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshLambertMaterial({color:0x4caf50})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

let player = {x:0, z:0, y:1.6, velocityY:0, grounded:true, radius:0.4};
let rotation = {yaw:0, pitch:0};

// Store tree collision boxes
let trees = [];

for(let i=0;i<20;i++){
  let x = (Math.random()-0.5)*20;
  let z = (Math.random()-0.5)*20;

  const trunk = new THREE.Mesh(
    new THREE.BoxGeometry(0.8,2,0.8),
    new THREE.MeshLambertMaterial({color:0x8B4513})
  );
  trunk.position.set(x,1,z);

  const leaves = new THREE.Mesh(
    new THREE.BoxGeometry(2,2,2),
    new THREE.MeshLambertMaterial({color:0x2e7d32})
  );
  leaves.position.set(x,3,z);

  scene.add(trunk);
  scene.add(leaves);

  // collision (simple square bounds)
  trees.push({x:x, z:z, size:0.8});
}

const ai = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshLambertMaterial({color:0xff0000})
);
ai.position.set(3,0.5,3);
scene.add(ai);

function setupJoystick(baseId, stickId, output){
  const base = document.getElementById(baseId);
  const stick = document.getElementById(stickId);

  base.addEventListener('touchmove', e=>{
    const rect = base.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left - rect.width/2;
    const y = e.touches[0].clientY - rect.top - rect.height/2;

    output.x = x/40;
    output.y = y/40;

    stick.style.left = (35 + x/2) + 'px';
    stick.style.top = (35 + y/2) + 'px';
  });

  base.addEventListener('touchend', ()=>{
    output.x = 0; output.y = 0;
    stick.style.left = '35px';
    stick.style.top = '35px';
  });
}

let move = {x:0,y:0};
let look = {x:0,y:0};

setupJoystick('moveJoy','moveStick',move);
setupJoystick('lookJoy','lookStick',look);

const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('touchstart', ()=>{
  if(player.grounded){
    player.velocityY = 0.25;
    player.grounded = false;
  }
});

function checkCollision(nx, nz){
  for(let t of trees){
    let dx = nx - t.x;
    let dz = nz - t.z;
    let dist = Math.sqrt(dx*dx + dz*dz);

    if(dist < player.radius + t.size/2){
      return true;
    }
  }
  return false;
}

function aiThink(){
  const dx = player.x - ai.position.x;
  const dz = player.z - ai.position.z;
  ai.position.x += dx * 0.01;
  ai.position.z += dz * 0.01;
}

function animate(){
  requestAnimationFrame(animate);

  let newX = player.x;
  let newZ = player.z;

  newX += Math.sin(rotation.yaw) * move.y * 0.1;
  newZ += Math.cos(rotation.yaw) * move.y * 0.1;
  newX += Math.cos(rotation.yaw) * move.x * 0.1;
  newZ -= Math.sin(rotation.yaw) * move.x * 0.1;

  // collision check
  if(!checkCollision(newX, player.z)) player.x = newX;
  if(!checkCollision(player.x, newZ)) player.z = newZ;

  rotation.yaw -= look.x * 0.03;
  rotation.pitch -= look.y * 0.03;
  rotation.pitch = Math.max(-1.5, Math.min(1.5, rotation.pitch));

  player.velocityY -= 0.01;
  player.y += player.velocityY;

  if(player.y <= 1.6){
    player.y = 1.6;
    player.velocityY = 0;
    player.grounded = true;
  }

  camera.position.set(player.x, player.y, player.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = rotation.yaw;
  camera.rotation.x = rotation.pitch;

  aiThink();

  renderer.render(scene, camera);
}

animate();
</script></body>
</html>
